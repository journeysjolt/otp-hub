<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTP Hub</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>OTP Hub</h1>
    <p class="muted">Login, plans, and OTP tools</p>

    <section class="card">
      <h2>Send OTP</h2>
      <input id="phone" placeholder="+91XXXXXXXXXX" />
      <select id="channel">
        <option value="sms">SMS</option>
        <option value="whatsapp">WhatsApp</option>
      </select>
      <button id="sendBtn">Send OTP</button>
    </section>

    <section class="card">
      <h2>Verify OTP</h2>
      <input id="vPhone" placeholder="+91XXXXXXXXXX" />
      <input id="code" placeholder="Enter OTP" />
      <button id="verifyBtn">Verify OTP</button>
    </section>

    <pre id="out"></pre>
  </main>

  <script src="app.js"></script>
</body>
</html>
