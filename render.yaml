services:
  - type: web
    name: otp-hub
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: prod
      - key: OTP_PROVIDER
        value: console
      - key: OTP_TTL_SECONDS
        value: "300"
